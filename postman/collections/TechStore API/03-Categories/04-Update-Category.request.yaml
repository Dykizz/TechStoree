$kind: http-request
name: "C\u1EADp nh\u1EADt danh m\u1EE5c"
method: PUT
url: '{{baseUrl}}/api/categories/{{categoryId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "\u0110i\u1EC7n tho\u1EA1i th\xF4ng minh (C\u1EADp nh\u1EADt)"
    }
