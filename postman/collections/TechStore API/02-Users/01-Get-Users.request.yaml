$kind: http-request
name: "\u0110\u1ECDc danh s\xE1ch ng\u01B0\u1EDDi d\xF9ng"
method: GET
url: '{{baseUrl}}/api/users'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
queryParams:
