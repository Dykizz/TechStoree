services:
  # Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: webbanhang_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-web_ban_hang}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - webbanhang_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_ban_hang"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Web API .NET 10
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: webbanhang_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-web_ban_hang};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres123}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:30001,http://localhost:3001}
      # Giữ đúng tên CLOUDINARY_* (CloudinaryService đọc biến môi trường trực tiếp, không qua IConfiguration)
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_DEFAULT_FOLDER=${CLOUDINARY_DEFAULT_FOLDER:-techstore}
    depends_on:
      postgres:
        condition: service_healthy

  # Giao diện quản lý PostgreSQL qua Web (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webbanhang_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json
      - webbanhang_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  webbanhang_pgdata:
  webbanhang_pgadmin_data:
